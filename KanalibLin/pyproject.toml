[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kanaliblin"
version = "1.0.0"
description = "Python API for the LIN channel of a KanaLin USB interface"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pyserial>=3.5"]
# Conservative placeholder: no terms are granted until this is decided.
license = { text = "Proprietary - all rights reserved" }

[tool.setuptools.packages.find]
include = ["kanaliblin*"]

# Ships the PEP 561 marker so type checkers use the annotations in consumers.
[tool.setuptools.package-data]
kanaliblin = ["py.typed"]
